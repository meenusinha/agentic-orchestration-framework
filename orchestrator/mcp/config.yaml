# Orchestrator configuration — the ONLY file you edit to register your repos.
#
# Steps:
#   1. Fill in the repos list below (one entry per repo you want to orchestrate)
#   2. Run:  python orchestrator/setup.py
#   3. Open each repo in VS Code — MCP servers are ready
#   4. Watch logs:  tail -f ~/.agentic-orchestration/logs/mcp-orchestration.log

repos:
  - name: repo-one                        # unique identifier (no spaces, matches repo-agent config.yaml)
    display_name: Repo One                # human-readable name shown in routing output
    path: /absolute/path/to/repo-one     # absolute path, OR relative to this file (e.g. ../repo-one)

  - name: repo-two
    display_name: Repo Two
    path: /absolute/path/to/repo-two

  # Add more repos here — no limit
  # - name: repo-three
  #   display_name: Repo Three
  #   path: /absolute/path/to/repo-three

# Log file — private (0600) per-user location by default; tail -f it in a terminal
log_file: ~/.agentic-orchestration/logs/mcp-orchestration.log

# Include code/doc snippets and feature-request text in the logs (troubleshooting only).
# Off by default so logs never hold source code.
log_content: false

# Router: repositories picked per request, and search hits per repository used for routing
router_top_repos: 2
router_hits_per_repo: 6

# Embedding model folder, used in place and hash-checked like any copy.
# Empty = the model included in this framework (models/granite-embedding-small-english-r2).
model_path: ""
